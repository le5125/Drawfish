<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Drawfish — 全球互動水族箱</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --deep:        #1a6b9c;
    --abyss:       #2a8bc4;
    --mid:         #4eb3d9;
    --shallow:     #8fd6e8;
    --surface:     #c7ecf5;
    --foam:        #ffffff;
    --sun:         #fff6c4;
    --coral:       #ff5a3c;
    --ink:         #002844;
    --gold:        #ffc857;
    --display:     'Fraunces', Georgia, serif;
    --mono:        'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--display);
    color: var(--foam);
    background: var(--deep);
    user-select: none;
    -webkit-user-select: none;
  }

  #aquarium {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 100% 70% at 50% 0%, rgba(255,246,196,0.5) 0%, rgba(255,246,196,0) 55%),
      linear-gradient(180deg, var(--surface) 0%, var(--shallow) 35%, var(--mid) 70%, var(--abyss) 100%);
    overflow: hidden;
    cursor: crosshair;
  }

  #aquarium::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 60px),
      repeating-linear-gradient(65deg,  rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px, transparent 2px, transparent 90px);
    mix-blend-mode: screen;
    animation: caustics 18s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes caustics {
    0%   { transform: translate(0, 0) scale(1); opacity: 0.7; }
    100% { transform: translate(-40px, 30px) scale(1.05); opacity: 1; }
  }

  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 60%, transparent 70%);
    pointer-events: none;
    animation: bubbleRise linear infinite;
  }
  @keyframes bubbleRise {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    10%  { opacity: 0.7; }
    50%  { transform: translate(20px, -50vh) scale(1); }
    100% { transform: translate(-30px, -110vh) scale(0.8); opacity: 0; }
  }

  #seabed {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 18vh;
    background:
      radial-gradient(ellipse 30% 100% at 12% 100%, #0d3a5c 0%, transparent 70%),
      radial-gradient(ellipse 35% 90%  at 42% 100%, #0d3a5c 0%, transparent 70%),
      radial-gradient(ellipse 25% 110% at 72% 100%, #0d3a5c 0%, transparent 70%),
      radial-gradient(ellipse 32% 80%  at 95% 100%, #0d3a5c 0%, transparent 70%),
      linear-gradient(to top, #0d3a5c 0%, rgba(13, 58, 92, 0) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ===== 水草 ===== */
  .plant {
    position: absolute;
    bottom: 0;
    transform-origin: bottom center;
    z-index: 2;
    pointer-events: none;
    animation: plantSway 5s ease-in-out infinite alternate;
  }
  @keyframes plantSway {
    0%   { transform: rotate(-4deg); }
    100% { transform: rotate(5deg); }
  }
  .blade {
    position: absolute;
    bottom: 0;
    border-radius: 50% 50% 8% 8% / 90% 90% 4% 4%;
    transform-origin: bottom center;
    background: linear-gradient(to top, #052f1a 0%, #0a5a2e 30%, #1a8a47 70%, #4dbd6c 100%);
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.3), inset 2px 0 4px rgba(255,255,255,0.15);
    animation: bladeWave 4s ease-in-out infinite alternate;
  }
  @keyframes bladeWave {
    0%   { transform: rotate(var(--start, -8deg)) scaleY(1); }
    100% { transform: rotate(var(--end, 10deg))  scaleY(1.04); }
  }

  .anemone { position: absolute; bottom: 0; z-index: 2; pointer-events: none; }
  .anemone .base {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 14px;
    background: radial-gradient(ellipse at top, #c44a8a 0%, #7a2752 80%);
    border-radius: 50% 50% 20% 20% / 70% 70% 30% 30%;
  }
  .tentacle {
    position: absolute;
    bottom: 8px;
    width: 4px;
    border-radius: 50% 50% 30% 30% / 80% 80% 20% 20%;
    background: linear-gradient(to top, #b03a78 0%, #e878b0 80%, #ffb3d9 100%);
    transform-origin: bottom center;
    animation: tentacleWave 2.5s ease-in-out infinite alternate;
  }
  @keyframes tentacleWave {
    0%   { transform: rotate(var(--ts, -15deg)) scaleY(1); }
    100% { transform: rotate(var(--te, 15deg))  scaleY(1.08); }
  }

  .coral-rock { position: absolute; bottom: 0; z-index: 2; pointer-events: none; }
  .coral-branch {
    position: absolute; bottom: 0;
    width: 8px;
    background: linear-gradient(to top, #d2691e 0%, #ff8c42 60%, #ffb88c 100%);
    border-radius: 50% 50% 20% 20%;
    transform-origin: bottom center;
    box-shadow: inset -1px 0 2px rgba(0,0,0,0.3);
  }

  /* ===== 魚 — 回歸純 CSS animation，瀏覽器自己處理就順 ===== */
  .fish-wrap {
    position: absolute;
    pointer-events: auto;
    cursor: pointer;
    z-index: 3;
  }
  .fish-wrap:hover { filter: brightness(1.15); }

  /* 頭朝左的魚：先從右往左游，再翻身往右游，這算一個來回。共 3 個來回。 */
  .fish-wrap.swim-left {
    animation: swimRoundLeft linear forwards;
    animation-iteration-count: 3;
  }
  @keyframes swimRoundLeft {
    /* 第一階段：頭朝左，從右游到左 */
    0%     { transform: translateX(calc(100vw - 100px)) scaleX(1); }
    49.9%  { transform: translateX(0) scaleX(1); }
    /* 翻身（瞬間） */
    50%    { transform: translateX(0) scaleX(-1); }
    /* 第二階段：頭朝右（鏡像後），從左游到右 */
    100%   { transform: translateX(calc(100vw - 100px)) scaleX(-1); }
  }

  /* 頭朝右的魚：先從左往右游，再翻身往左游 */
  .fish-wrap.swim-right {
    animation: swimRoundRight linear forwards;
    animation-iteration-count: 3;
  }
  @keyframes swimRoundRight {
    0%     { transform: translateX(0) scaleX(1); }
    49.9%  { transform: translateX(calc(100vw - 100px)) scaleX(1); }
    50%    { transform: translateX(calc(100vw - 100px)) scaleX(-1); }
    100%   { transform: translateX(0) scaleX(-1); }
  }

  /* 上下浮沉 */
  .fish-bob {
    animation: bob 3s ease-in-out infinite alternate;
  }
  @keyframes bob {
    0%   { transform: translateY(-5px); }
    100% { transform: translateY(6px); }
  }

  .fish-img {
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0, 40, 68, 0.35));
  }

  /* ===== HUD ===== */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
    pointer-events: none;
  }
  .brand {
    font-family: var(--display);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.5);
    line-height: 1;
  }
  .brand .em { font-style: italic; font-weight: 500; color: var(--coral); }
  .brand .sub {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink);
    margin-top: 6px;
    opacity: 0.6;
  }

  .top-controls { display: flex; gap: 8px; pointer-events: auto; }
  .pill-btn {
    background: rgba(255, 255, 255, 0.85);
    color: var(--ink);
    border: 1.5px solid rgba(0, 40, 68, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 16px;
    border-radius: 999px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pill-btn:hover {
    background: #fff;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0, 40, 68, 0.15);
  }
  .pill-btn .icon { font-size: 16px; }

  #summon {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: var(--coral);
    color: #fff;
    border: none;
    padding: 16px 32px;
    font-family: var(--display);
    font-style: italic;
    font-weight: 700;
    font-size: 18px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 14px 40px rgba(255, 90, 60, 0.5), 0 0 0 6px rgba(255, 90, 60, 0.15);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #summon:hover { transform: translateX(-50%) translateY(-3px) scale(1.03); }
  #summon:active { transform: translateX(-50%) translateY(0) scale(0.98); }

  /* ===== Modal ===== */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0, 40, 68, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .modal-bg.open { display: flex; opacity: 1; }

  .modal {
    background: linear-gradient(180deg, #fdfaf3 0%, #f5ede0 100%);
    color: var(--ink);
    border-radius: 20px;
    padding: 18px 20px;
    width: 100%;
    max-width: 460px;
    max-height: 96vh;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    transform: translateY(20px) scale(0.96);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }
  .modal-bg.open .modal { transform: translateY(0) scale(1); }

  /* 畫畫視窗特化：高度撐滿可視範圍，內部 flex 自動配置 */
  #draw-modal .modal-bg { padding: 8px; }
  #draw-modal .modal {
    max-width: 880px;
    max-height: 96vh;
    height: auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 14px 16px;
  }
  #draw-modal .modal-header { margin-bottom: 8px; flex-shrink: 0; }
  #draw-modal .toolbar { flex-shrink: 0; }
  #draw-modal .bottom-row { flex-shrink: 0; margin-top: 8px; }
  /* 畫布吃掉剩下的空間 */
  #draw-modal #canvas-wrap {
    flex: 1 1 auto;
    aspect-ratio: auto;       /* 取消寬高比限制 */
    min-height: 200px;        /* 至少 200px */
    height: 100%;             /* 撐滿剩餘空間 */
    width: 100%;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .modal-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .modal-title em { font-weight: 500; color: var(--coral); }
  .modal-hint {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #7a8590;
  }

  .btn-close {
    position: absolute;
    top: 10px; right: 12px;
    background: transparent;
    border: none;
    font-size: 20px;
    color: #7a8590;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    z-index: 2;
  }
  .btn-close:hover { background: rgba(0, 40, 68, 0.08); color: var(--ink); }

  /* ===== 畫畫工具列（在畫布上方） ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #fff;
    border-radius: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(0, 40, 68, 0.06);
  }
  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .toolbar-divider {
    width: 1px;
    height: 22px;
    background: rgba(0, 40, 68, 0.1);
  }
  .toolbar-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #7a8590;
    margin-right: 2px;
  }
  .swatch {
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: var(--ink); transform: scale(1.15); }
  .tool-btn {
    width: 32px; height: 32px;
    border: 1.5px solid rgba(0, 40, 68, 0.15);
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
    color: var(--ink);
  }
  .tool-btn:hover { background: #f5ede0; }
  .tool-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .size-slider {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .size-slider input {
    width: 80px;
    accent-color: var(--coral);
  }
  .size-preview {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .size-preview-dot {
    background: var(--ink);
    border-radius: 50%;
    transition: width 0.1s, height 0.1s;
  }

  /* ===== 畫布 ===== */
  #canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    background: linear-gradient(135deg, #e8f4f8 0%, #d4ebef 100%);
    border: 2px dashed rgba(10, 90, 143, 0.25);
    overflow: hidden;
    cursor: crosshair;
    touch-action: none;
    flex-shrink: 0;
  }
  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #canvas-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    color: rgba(10, 90, 143, 0.5);
    font-family: var(--display);
    font-style: italic;
    font-size: 16px;
    transition: opacity 0.3s;
  }
  #canvas-placeholder .fish-icon { font-size: 36px; margin-bottom: 4px; opacity: 0.7; }
  #canvas-wrap.has-drawing #canvas-placeholder { opacity: 0; }

  .head-marker {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.9);
    padding: 5px 9px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 10px;
    color: #7a8590;
    cursor: pointer;
    border: 1.5px solid rgba(0, 40, 68, 0.1);
    transition: all 0.2s;
    z-index: 5;
  }
  .head-marker:hover { color: var(--ink); }
  .head-marker.active {
    background: var(--coral);
    color: #fff;
    border-color: var(--coral);
    box-shadow: 0 4px 14px rgba(255, 90, 60, 0.4);
  }
  .head-left  { left: 8px; }
  .head-right { right: 8px; }
  .head-arrow { font-size: 11px; }
  .head-label { font-family: var(--display); font-weight: 700; font-size: 12px; }

  /* ===== 底部列：名字 + 按鈕 ===== */
  .bottom-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .name-input {
    flex: 1;
    padding: 12px 14px;
    border: 1.5px solid rgba(0, 40, 68, 0.15);
    border-radius: 12px;
    font-family: var(--display);
    font-size: 15px;
    color: var(--ink);
    background: #fff;
    outline: none;
    min-width: 0;
  }
  .name-input:focus { border-color: var(--coral); }
  .head-quickpick {
    display: flex;
    background: #fff;
    border: 1.5px solid rgba(0, 40, 68, 0.15);
    border-radius: 12px;
    padding: 4px;
    gap: 2px;
  }
  .head-quickpick button {
    background: transparent;
    border: none;
    padding: 6px 10px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 12px;
    color: #7a8590;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.15s;
  }
  .head-quickpick button.active {
    background: var(--coral);
    color: #fff;
  }
  .btn {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
  }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid rgba(0, 40, 68, 0.2);
  }
  .btn-secondary:hover { background: rgba(0, 40, 68, 0.05); }
  .btn-primary {
    background: var(--ink);
    color: #fff;
    font-style: italic;
    box-shadow: 0 8px 20px rgba(0, 40, 68, 0.25);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0, 40, 68, 0.35); }
  .btn-primary:disabled { background: #9aa5b1; cursor: not-allowed; box-shadow: none; transform: none; }

  /* ===== 列表 ===== */
  .list-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: rgba(0, 40, 68, 0.06);
    padding: 4px;
    border-radius: 12px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 9px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    color: #7a8590;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .tab.active {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 2px 6px rgba(0, 40, 68, 0.08);
  }

  /* ===== 排行榜 / 我的魚缸：卡片格狀 ===== */
  #list-modal .modal { max-width: 720px; }

  .fish-list {
    max-height: 65vh;
    overflow-y: auto;
    margin: 0 -4px;
    padding: 0 4px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .fish-card {
    background: #fff;
    border-radius: 12px;
    padding: 8px;
    position: relative;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 1px 3px rgba(0, 40, 68, 0.08);
    cursor: pointer;
  }
  .fish-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 40, 68, 0.15);
  }

  /* 名次徽章（金銀銅） */
  .rank-badge {
    position: absolute;
    top: -6px;
    left: -6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--ink);
    font-family: var(--display);
    font-weight: 700;
    font-style: italic;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0, 40, 68, 0.2);
    z-index: 2;
  }
  .rank-badge.rank-1 { background: var(--gold); }
  .rank-badge.rank-2 { background: #d0d0d0; }
  .rank-badge.rank-3 { background: #cd9168; color: #fff; }
  .rank-badge.rank-other { background: #f5ede0; color: #7a8590; font-size: 12px; }

  /* 縮圖區 */
  .card-thumb-wrap {
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(135deg, #e8f4f8, #d4ebef);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .card-thumb {
    max-width: 85%;
    max-height: 85%;
    object-fit: contain;
  }

  /* 名字 + 日期 */
  .fc-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

const firebaseConfig = {

/* ============================================================

function getOrCreateUserId() {
  let uid = localStorage.getItem('drawfish_uid');
  if (!uid) {
    uid = 'u_' + Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
    localStorage.setItem('drawfish_uid', uid);
  }
  return uid;
}
const USER_ID = getOrCreateUserId();

function getFavorites() {
  try { return JSON.parse(localStorage.getItem('drawfish_favs') || '[]'); } catch { return []; }
}
function setFavorites(arr) { localStorage.setItem('drawfish_favs', JSON.stringify(arr)); }
function isFavorite(id) { return getFavorites().includes(id); }
function toggleFavorite(id) {
  const favs = getFavorites();
  const idx = favs.indexOf(id);
  if (idx >= 0) favs.splice(idx, 1); else favs.push(id);
  setFavorites(favs);

}

const fishDB = {};

const aquarium = document.getElementById('aquarium');

function spawnBubbles() {

function spawnPlants() {

spawnBubbles(); spawnPlants(); spawnAnemones(); spawnCorals();

/* ============================================================
   魚兒動畫 — 純 CSS animation，瀏覽器自己跑就順
   依頭朝向決定游動方向：
   - 頭朝左 → 從右游到左
   - 頭朝右 → 從左游到右
   ============================================================ */

const MAX_FISHES_IN_TANK = 40; // 同時在水族箱裡最多 40 條

function releaseFish(fishData) {
  // 上限保護：超過 40 條就把最舊的拿掉
  const currentCount = aquarium.querySelectorAll('.fish-wrap').length;
  if (currentCount >= MAX_FISHES_IN_TANK) {
    const oldest = aquarium.querySelector('.fish-wrap');
    if (oldest) {
      swimmingFishes.delete(oldest);
      oldest.style.transition = 'opacity 0.4s';
      oldest.style.opacity = '0';
      setTimeout(() => oldest.remove(), 400);
    }
  }

  const { id, image, headDirection = 'left' } = fishData;

  const wrap = document.createElement('div');
  wrap.className = 'fish-wrap';
  wrap.dataset.fishId = id;
  // 依頭朝向決定要播哪個動畫
  wrap.classList.add(headDirection === 'left' ? 'swim-left' : 'swim-right');

  const bobLayer = document.createElement('div');
  bobLayer.className = 'fish-bob';

  const img = document.createElement('img');
  img.src = image;
  img.className = 'fish-img';
  img.draggable = false;

  const scale = 0.7 + Math.random() * 0.7;
  const size = 100 * scale;
  img.style.width = size + 'px';
  img.style.height = size + 'px';

  bobLayer.appendChild(img);
  wrap.appendChild(bobLayer);

  // 隨機高度
  const topVh = 12 + Math.random() * 55;
  wrap.style.top = topVh + 'vh';

  // 一個來回（左→右 或 右→左 完整一次）的時間：12~20 秒
  // 由於 iteration-count = 3，總共會跑 3 個來回
  const roundDuration = 12 + Math.random() * 8;
  wrap.style.animationDuration = roundDuration + 's';

  // 上下浮沉延遲隨機
  bobLayer.style.animationDelay = (Math.random() * 2) + 's';

  // 註冊到「正在游的魚」集合（給飼料碰撞用）
  swimmingFishes.add(wrap);

  // 點擊浮卡
  wrap.addEventListener('click', (e) => {
    e.stopPropagation();
    showFishCard(id, e.clientX, e.clientY);
  });

  // 動畫結束（跑完 3 個來回）→ 淡出消失
  wrap.addEventListener('animationend', (e) => {
    if (e.animationName === 'swimRoundLeft' || e.animationName === 'swimRoundRight') {
      swimmingFishes.delete(wrap);
      wrap.style.transition = 'opacity 1s';
      wrap.style.opacity = '0';
      setTimeout(() => wrap.remove(), 1000);
    }
  });

  aquarium.appendChild(wrap);
}

/* ============================================================
   飼料碰撞偵測：魚游過飼料時，飼料消失（看起來像被吃了）
   ============================================================ */
const swimmingFishes = new Set(); // 正在游的魚 wrap
const activeFood = new Set();     // 還在掉的飼料元素

// 每 100ms 檢查一次碰撞
setInterval(() => {
  if (activeFood.size === 0 || swimmingFishes.size === 0) return;

  for (const food of activeFood) {
    if (!food.parentNode) {
      activeFood.delete(food);
      continue;
    }
    const fr = food.getBoundingClientRect();
    const fx = fr.left + fr.width / 2;
    const fy = fr.top + fr.height / 2;

    for (const fish of swimmingFishes) {
      if (!fish.parentNode) continue;
      const r = fish.getBoundingClientRect();
      // 魚張開的「嘴巴範圍」(整個身體 + 一點 buffer)
      if (fx >= r.left - 10 && fx <= r.right + 10 &&
          fy >= r.top - 10  && fy <= r.bottom + 10) {
        // 被吃了！讓飼料快速縮放消失
        food.style.transition = 'transform 0.2s ease-out, opacity 0.2s';
        food.style.transform += ' scale(0)';
        food.style.opacity = '0';
        setTimeout(() => food.remove(), 200);
        activeFood.delete(food);
        break;
      }
    }
  }
}, 100);

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const point = (e.touches && e.touches[0]) || e;
  return {
    x: (point.clientX - rect.left) * scaleX,
    y: (point.clientY - rect.top) * scaleY
  };
}
function getStrokeWidth() {
  return brushSize.value * (canvas.width / canvasWrap.offsetWidth);
}

function startDraw(e) {
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  startX = p.x; startY = p.y;
  canvasWrap.classList.add('has-drawing');

  if (currentTool === 'pen' || currentTool === 'eraser') {
    if (currentTool === 'eraser') {
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(p.x, p.y, getStrokeWidth() / 2 + 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.fillStyle = currentColor;
      ctx.arc(p.x, p.y, getStrokeWidth() / 2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    // 形狀工具：先存畫面
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
}

function moveDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  const sw = getStrokeWidth();

  if (currentTool === 'pen') {
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = sw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  } else if (currentTool === 'eraser') {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = sw + 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.restore();
    lastX = p.x; lastY = p.y;
  } else if (snapshot) {
    // 還原 + 重畫形狀（橡皮筋效果）
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = sw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (currentTool === 'line') {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (currentTool === 'circle') {
      const dx = p.x - startX, dy = p.y - startY;
      const r = Math.sqrt(dx*dx + dy*dy);
      ctx.beginPath();
      ctx.arc(startX, startY, r, 0, Math.PI * 2);
      ctx.stroke();
    } else if (currentTool === 'rect') {
      ctx.beginPath();
      ctx.rect(startX, startY, p.x - startX, p.y - startY);
      ctx.stroke();
    }
  }
}
function endDraw() {
  drawing = false;
  snapshot = null;
}
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', moveDraw, { passive: false });
canvas.addEventListener('touchend', endDraw);

function clearCanvas() {

function canvasIsBlank() {
  const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let drawn = 0;
  for (let i = 3; i < pixels.length; i += 4) {
    if (pixels[i] > 0) drawn++;
    if (drawn > 50) return false;
  }
  return true;
}

function getTrimmedCanvas(srcCanvas) {
  const w = srcCanvas.width, h = srcCanvas.height;
  const data = srcCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  let top = h, left = w, right = 0, bottom = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4 + 3;
      if (data[idx] > 0) {
        if (x < left) left = x;
        if (x > right) right = x;
        if (y < top) top = y;
        if (y > bottom) bottom = y;
      }
    }
  }
  if (right < left || bottom < top) return null;
  const pad = 12;
  left   = Math.max(0, left - pad);
  top    = Math.max(0, top - pad);
  right  = Math.min(w - 1, right + pad);
  bottom = Math.min(h - 1, bottom + pad);
  const cw = right - left + 1;
  const ch = bottom - top + 1;
  const maxSide = 300;
  const scale = Math.min(1, maxSide / Math.max(cw, ch));
  const out = document.createElement('canvas');
  out.width = Math.round(cw * scale);
  out.height = Math.round(ch * scale);
  out.getContext('2d').drawImage(srcCanvas, left, top, cw, ch, 0, 0, out.width, out.height);
  return out;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderList() {
  let arr = Object.values(fishDB);
  if (currentListMode === 'leaderboard') {
    arr.sort((a, b) => (b.likes - b.dislikes) - (a.likes - a.dislikes));
    arr = arr.slice(0, 50);
  } else if (currentListMode === 'mine') {
    arr = arr.filter(f => f.ownerId === USER_ID).sort((a, b) => b.createdAt - a.createdAt);
  } else if (currentListMode === 'favorites') {
    const favs = getFavorites();
    arr = arr.filter(f => favs.includes(f.id));
  }
  if (arr.length === 0) {
    const emptyMsg = {
      leaderboard: ['🏆', '還沒有魚兒上榜，快去畫一隻！'],
      mine:        ['🐟', '你還沒畫過魚，按下方紅色按鈕開始！'],
      favorites:   ['⭐', '你還沒收藏任何魚，點水族箱裡的魚加入吧！'],
    }[currentListMode];
    fishList.innerHTML = `<div class="empty-state"><div class="em-icon">${emptyMsg[0]}</div><div>${emptyMsg[1]}</div></div>`;
    return;
  }
  fishList.innerHTML = '';
  arr.forEach((fish, idx) => {
    const card = document.createElement('div');
    card.className = 'fish-card';
    const isMine = fish.ownerId === USER_ID;
    const score = fish.likes - fish.dislikes;
    const fav = isFavorite(fish.id);

    // 排名徽章
    let rankHTML = '';
    if (currentListMode === 'leaderboard') {
      let rankCls = 'rank-other';
      let rankText = (idx + 1);
      if (idx === 0)      { rankCls = 'rank-1'; rankText = '🥇'; }
      else if (idx === 1) { rankCls = 'rank-2'; rankText = '🥈'; }
      else if (idx === 2) { rankCls = 'rank-3'; rankText = '🥉'; }
      rankHTML = `<div class="rank-badge ${rankCls}">${rankText}</div>`;
    }

    // 日期
    const d = new Date(fish.createdAt || Date.now());
    const dateStr = `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;

    // 分數樣式
    const scoreCls = score > 0 ? 'positive' : score < 0 ? 'negative' : '';
    const scoreStr = `評分：${score >= 0 ? '+' : ''}${score}`;

    card.innerHTML = `
      ${rankHTML}
      <div class="fc-actions">
        <button class="icon-btn release-btn" title="放進水族箱">🌊</button>
        <button class="icon-btn fav ${fav ? 'active' : ''}" title="${fav ? '取消收藏' : '加到我的最愛'}">★</button>
        ${isMine ? '<button class="icon-btn danger del-btn" title="刪除">🗑</button>' : ''}
      </div>
      <div class="card-thumb-wrap">
        <img class="card-thumb" src="${fish.image}" alt="">
      </div>
      <div class="fc-name">${isMine ? '<span class="me-mark"></span>' : ''}${escapeHTML(fish.name)}</div>
      <div class="fc-date">${dateStr}</div>
      <div class="fc-score ${scoreCls}">${scoreStr}</div>
      <div class="fc-votes">
        <span>👍 ${fish.likes}</span>
        <span>👎 ${fish.dislikes}</span>
      </div>
    `;

    // 點卡片本身（不是按鈕）= 放進魚缸
    card.addEventListener('click', (e) => {
      if (e.target.closest('.icon-btn')) return;
      releaseFish(fish);
      showToast(`「${fish.name}」游進魚缸了 🐟`);
    });

    card.querySelector('.release-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      releaseFish(fish);
      showToast(`「${fish.name}」游進魚缸了 🐟`);
    });
    card.querySelector('.fav').addEventListener('click', (e) => {
      e.stopPropagation();
      const nowFav = toggleFavorite(fish.id);
      e.currentTarget.classList.toggle('active', nowFav);
      e.currentTarget.title = nowFav ? '取消收藏' : '加到我的最愛';
      if (currentListMode === 'favorites') renderList();

    const delBtn = card.querySelector('.del-btn');
    if (delBtn) delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteFish(fish.id, fish.name);
    });
    fishList.appendChild(card);
  });
}

function showFishCard(id, x, y) {

async function voteFish(id, type, currentVote) {
  let likeDelta = 0, dislikeDelta = 0, newVote = type;
  if (currentVote === type) {
    if (type === 'like') likeDelta = -1; else dislikeDelta = -1;
    newVote = null;
  } else if (currentVote && currentVote !== type) {
    if (type === 'like') { likeDelta = 1;  dislikeDelta = -1; }
    else                 { likeDelta = -1; dislikeDelta = 1;  }
  } else {
    if (type === 'like') likeDelta = 1; else dislikeDelta = 1;
  }
  if (!isConfigured) {
    if (!fishDB[id]) return;
    fishDB[id].likes    = Math.max(0, fishDB[id].likes + likeDelta);
    fishDB[id].dislikes = Math.max(0, fishDB[id].dislikes + dislikeDelta);
    setVote(id, newVote);
    refreshCard();
    return;
  }
  try {
    await runTransaction(ref(db, 'fishes/' + id), (data) => {
      if (data === null) return data;
      data.likes    = Math.max(0, (data.likes || 0)    + likeDelta);
      data.dislikes = Math.max(0, (data.dislikes || 0) + dislikeDelta);
      return data;
    });
    setVote(id, newVote);
    refreshCard();
  } catch (err) {
    console.error(err);
    showToast('投票失敗 😢');
  }
}

aquarium.addEventListener('click', (e) => {
  if (currentCardFishId) hideFishCard();
  else spawnFood(e.clientX, e.clientY);
});

const toast = document.getElementById('toast');
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

window.__drawfish = { releaseFish, fishDB, USER_ID };
</script>
